<main id="main" class="home">
  <!-- 첫 화면: 왼쪽 사진, 오른쪽 이름·소개 -->
  <section id="about" class="intro ${portrait_class}" aria-labelledby="name">
    ${portrait}
    <div class="profile-details">
      <aside class="identity">
        <h1 id="name">${name_lines}</h1>
        <p class="location">${location}</p>
        <div class="contact-links">
          <a href="mailto:${email}">Email <span aria-hidden="true">↗</span></a>
          <a href="${github}">GitHub <span aria-hidden="true">↗</span></a>
          <a href="${linkedin}">LinkedIn <span aria-hidden="true">↗</span></a>
        </div>
      </aside>

      <div class="intro-copy">
        <p>${about}</p>
        <p>${research_interests}</p>
        ${cv_reference}
      </div>
    </div>
  </section>

  <!-- CV에서 추린 기본 이력 -->
  ${profile_background}
</main>
